version: '3.9'

services:

  db:
    image: postgres:16-alpine

    container_name: mywebapp-db

    restart: always

    environment:
      POSTGRES_DB: mywebapp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/init.sql:/docker-entrypoint-initdb.d/init.sql

    networks:
      - mywebapp-network

  web:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: mywebapp-web

    restart: always

    depends_on:
      - db

    environment:
      DB_HOST: db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: mywebapp
      DB_PORT: 5432

    networks:
      - mywebapp-network

  nginx:
    image: nginx:stable-alpine

    container_name: mywebapp-nginx

    restart: always

    ports:
      - "80:80"

    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - web

    networks:
      - mywebapp-network

volumes:
  postgres_data:

networks:
  mywebapp-network: