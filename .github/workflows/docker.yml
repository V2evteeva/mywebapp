name: Docker

on:
  push:
    branches:
      - main
      - lab3-ci-cd

jobs:

  docker:

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          docker build -t ghcr.io/v2evteeva/mywebapp:latest .

      - name: Push image
        run: |
          docker push ghcr.io/v2evteeva/mywebapp:latest
